network:
  interface: null
  window_seconds: 2
  sniff_filter: "ip"

honeypot:
  enabled: true
  port: 2222
  db_path: "data/live_events.db"

classifier:
  features:
    - packets_per_sec
    - avg_packet_size
    - unique_ports
    - syn_ratio
  confidence_threshold: 0.85
  confidence_margin: 0.10

firewall:
  backend: "iptables"

alerts:
  cooldown_seconds: 60
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"

whitelist:
  enabled: true
  ips:
    - "127.0.0.1"
    - "::1"
  subnets: []

detection:
  scan_window_seconds: 120.0
  min_scan_ports: 20
  min_syn_ratio: 0.75
  max_scan_pkt_size: 120.0

